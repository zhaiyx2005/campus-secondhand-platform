{% extends "base.html" %}

{% block title %}登录 - 旧物循用{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-card-header">
            <span class="auth-badge">校园闲置市集</span>
            <h1>欢迎回来</h1>
            <p class="auth-subtitle">登录后可以发布、收藏和管理你的校园二手商品。</p>
        </div>

        <form method="post" data-login-form>
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="mb-3">
                <label for="account" class="form-label">用户名</label>
                <input type="text" class="form-control" id="account" name="account" value="{{ account or '' }}" placeholder="请输入用户名">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码">
            </div>
            <div class="auth-options">
                <label class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember_password" name="remember_password">
                    <span class="form-check-label">记住密码</span>
                </label>
                <a href="{{ url_for('forgot_password') }}">忘记密码？</a>
            </div>
            <button type="submit" class="btn btn-gradient w-100">登录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
        </div>
    </div>
</section>
{% endblock %}
