{% extends "base.html" %}

{% block title %}忘记密码 - 旧物循用{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>找回密码</h1>
    <p class="auth-subtitle">输入用户名和个人中心预留的手机号/联系方式，通过后即可重置密码。</p>

    <form method="post">
        <div class="mb-3">
            <label for="account" class="form-label">用户名</label>
            <input type="text" class="form-control" id="account" name="account" value="{{ account or '' }}" placeholder="请输入用户名">
        </div>
        <div class="mb-3">
            <label for="contact" class="form-label">预留手机号/联系方式</label>
            <input type="text" class="form-control" id="contact" name="contact" value="{{ contact or '' }}" placeholder="与个人中心填写内容保持一致">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">新密码</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="不少于 6 位">
        </div>
        <div class="mb-4">
            <label for="confirm_password" class="form-label">确认新密码</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次输入新密码">
        </div>
        <button type="submit" class="btn btn-primary w-100">重置密码</button>
    </form>

    <div class="auth-footer">
        想起密码了？<a href="{{ url_for('login') }}">返回登录</a>
    </div>
</div>
{% endblock %}
